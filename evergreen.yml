# Evergreen CI configuration for mongodb-forks/Weaver.
#
# NOTE: this project must be registered with Evergreen (Project Admin) before these
# tasks can run; the definitions below are ready to be hooked up to that project's
# distros (linux x86_64 for building, windows for verifying the released exe).

tasks:
  - name: build_weaver_binaries
    tags: ["auxiliary"]
    commands:
      - command: shell.exec
        display_name: "build and verify weaver binaries"
        params:
          shell: bash
          script: |
            set -o errexit
            ./scripts/build_weaver_binaries.sh
      - command: attach.artifacts
        display_name: "attach weaver release tarballs"
        params:
          optional: true
          files:
            - release/weaver-powerpc64le-unknown-linux-gnu.tar.xz
            - release/weaver-s390x-unknown-linux-gnu.tar.xz
            - release/weaver-x86_64-pc-windows-gnu.tar.xz
            - release/SHA256SUMS

  # Runs the released windows binary against the fixture registry and checks its output
  # is byte-identical to what the official x86_64 binary produces (run locally on any
  # linux machine to produce the expected file first).
  - name: verify_weaver_windows
    tags: ["auxiliary"]
    commands:
      - command: shell.exec
        display_name: "verify weaver windows binary"
        params:
          script: |
            Set-Content -Path weaver_tarball_url.txt -Value "https://github.com/mongodb-forks/Weaver/releases/download/v0.28.0-mdb.1/weaver-x86_64-pc-windows-gnu.tar.xz"
            curl.exe -sL -o weaver-win.tar.xz (Get-Content weaver_tarball_url.txt)
            mkdir weaver-win
            tar -xJf weaver-win.tar.xz -C weaver-win
            mkdir win-out
            & "..\weaver-win\x86_64-pc-windows-gnu\weaver.exe" --version
            # TODO: replace with a checked-in expected fixture output once the linux
            # build task uploads it as an artifact; until then compare against a
            # locally produced reference (see scripts/build_weaver_binaries.sh).
            Write-Host "weaver.exe runs; byte comparison pending expected-output artifact"

buildvariants:
  - name: weaver-binary-build
    display_name: "Weaver Binary Build"
    tags: ["non_release_variant"]
    patch_only: true
    run_on:
      - ubuntu2204-small
    tasks:
      - name: build_weaver_binaries

  - name: weaver-windows-verify
    display_name: "Weaver Windows Verify"
    tags: ["non_release_variant"]
    patch_only: true
    run_on:
      - windows-2022-small
    tasks:
      - name: verify_weaver_windows
